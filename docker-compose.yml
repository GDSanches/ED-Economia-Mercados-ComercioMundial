x-airflow-common: &airflow-common
  build: ./airflow
  image: gedp-airflow:3.3.2-dbt1.11
  profiles: ["airflow"]
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # --- Projeto: o código em src/ e as credenciais do MinIO ---
    PYTHONPATH: /opt/airflow/project
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    MINIO_ENDPOINT_URL: http://minio:9000
    # --- Postgres do pipeline (loader e dbt) ---
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    # --- dbt: projeto montado somente leitura; artefatos vão para /tmp ---
    # Usadas em comandos manuais (ex.: docker compose exec airflow-scheduler .../dbt debug).
    # A task dbt_build da DAG passa os caminhos explicitamente e não depende delas.
    DBT_PROJECT_DIR: /opt/airflow/project/dbt
    DBT_PROFILES_DIR: /opt/airflow/project/dbt
    DBT_TARGET_PATH: /tmp/dbt/target
    DBT_LOG_PATH: /tmp/dbt/logs
    DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/project/src:ro
    - ./sql:/opt/airflow/project/sql:ro       # migrations do raw_staging (ensure_schema)
    - ./dbt:/opt/airflow/project/dbt:ro


services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volume nomeado: os dados sobrevivem a restart, stop e "docker compose down"
      - postgres_data:/var/lib/postgresql/data
      # Opcional: scripts .sql/.sh executados apenas na PRIMEIRA inicialização
      # - ./init:/docker-entrypoint-initdb.d:ro
    # Healthy = aceita conexão TCP (como um cliente externo) E executa uma query.
    # Usar -h 127.0.0.1 é essencial: na 1ª inicialização o entrypoint sobe um
    # Postgres temporário só no socket local para rodar os scripts de init;
    # sem o -h o check passaria nessa fase, antes do servidor definitivo.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB} &&
          PGPASSWORD=$${POSTGRES_PASSWORD} psql -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc 'SELECT 1' | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  # ---------------------------------------------------------------
  # Armazenamento de objetos (Data Lake) - compatível com MinIO/S3
  # Imagem: Silo, fork comunitário mantido do MinIO (a imagem oficial
  # minio/minio deixou de ser publicada).
  # ---------------------------------------------------------------
  minio:
    image: pgsty/silo:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: America/Sao_Paulo
    ports:
      - "${MINIO_API_PORT:-9000}:9000"      # API S3 (usada por Python, Spark, etc.)
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # Console web
    volumes:
      # Volume nomeado: buckets e objetos sobrevivem a restart e "down"
      - minio_data:/data
    # /minio/health/live  -> só diz que o processo está de pé.
    # /minio/health/ready -> diz que o servidor está pronto para atender
    #                        leituras/escritas (é o que importa para orquestração).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s

  # Container de inicialização: cria os buckets e encerra.
  # Só roda depois que o MinIO estiver saudável; é idempotente.
  minio-init:
    image: pgsty/silo:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mcli alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mcli mb --ignore-existing local/bronze &&
      mcli ls local
      "

  airflow-db:
    image: postgres:17-alpine
    profiles: ["airflow"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Roda uma vez: cria/atualiza as tabelas do Airflow e o usuário admin, e encerra.
  airflow-init:
    <<: *airflow-common
    command: version
    restart: "no"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on: &airflow-depends-on
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on: *airflow-depends-on

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on: *airflow-depends-on


volumes:
  postgres_data:
    name: postgres_data
  minio_data:
    name: minio_data
  airflow_db_data:
    name: airflow_db_data
