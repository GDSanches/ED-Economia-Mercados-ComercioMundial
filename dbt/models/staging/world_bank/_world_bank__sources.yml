version: 2

sources:
  - name: world_bank
    description: >
      Dados brutos da API do World Bank. O loader Python (src/staging/world_bank.py)
      copia as páginas do Bronze (MinIO) para o PostgreSQL. O dbt apenas lê.
    schema: raw_staging
    loader: python
    tags: ["world_bank", "raw"]

    tables:
      - name: pages
        identifier: world_bank_pages
        description: >
          Uma linha por página da API, por run de ingestão. A resposta da API é
          preservada sem alteração em payload. Só entram runs com manifest completed.

        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 7, period: day}
            error_after: {count: 30, period: day}

        columns:
          - name: run_id
            description: "UUID do run de ingestão. Um run = um dataset extraído em um momento."
            data_tests:
              - not_null

          - name: dataset
            description: "Nome interno do indicador (definido em src/ingestion/world_bank/config.py)."
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - countries
                      - gdp
                      - gdp_per_capita
                      - gdp_growth
                      - inflation
                      - unemployment
                      - exports_pct_gdp
                      - imports_pct_gdp
                      - gni_per_capita
                  config:
                    severity: warn
